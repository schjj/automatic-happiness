name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install autotools and C/C++ build tools
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y \
                      autoconf \
                      automake \
                      libtool \
                      make \
                      gcc \
                      g++ \
                      pkg-config

            - name: Verify tool versions
              run: |
                  autoconf --version | head -1
                  automake --version | head -1
                  libtool --version | head -1
                  make --version | head -1
                  gcc --version | head -1
                  g++ --version | head -1
                  pkg-config --version
